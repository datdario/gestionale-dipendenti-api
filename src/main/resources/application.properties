spring.application.name=gestionale-dipendenti

# Configurazione MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestionale_dipendenti?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Creazione e aggiornamento automatico delle tabelle da parte di Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true